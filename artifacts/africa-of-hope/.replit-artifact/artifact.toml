kind = "web"
previewPath = "/"
title = "Africa of Hope"
version = "1.0.0"
id = "artifacts/africa-of-hope"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19956

[services.development]
run = "pnpm --filter @workspace/africa-of-hope run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/africa-of-hope", "run", "build" ]
publicDir = "artifacts/africa-of-hope/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19956"
BASE_PATH = "/"
